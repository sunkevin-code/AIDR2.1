<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Agent 行为原子 · 多视图演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0f1c;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: radial-gradient(circle at 50% 50%, #141c2b, #0a0e17);
            border-radius: 40px;
            padding: 30px 30px 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            position: relative;
        }
        h1 {
            font-size: 26px;
            font-weight: 300;
            letter-spacing: 2px;
            text-align: center;
            background: linear-gradient(135deg, #a0c8ff, #4d8aff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }
        .sub {
            text-align: center;
            font-size: 14px;
            color: #7f8fa3;
            margin-bottom: 20px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .stats .stat-item {
            background: rgba(255,255,255,0.04);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 14px;
        }
        .stats .stat-item span {
            font-weight: 600;
            color: #a0c8ff;
        }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .tabs button {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: #b0c8e0;
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s;
            backdrop-filter: blur(4px);
        }
        .tabs button:hover {
            background: rgba(77, 138, 255, 0.2);
            border-color: #4d8aff;
            color: #fff;
        }
        .tabs button.active {
            background: rgba(77, 138, 255, 0.25);
            border-color: #4d8aff;
            color: #fff;
            box-shadow: 0 0 20px rgba(77, 138, 255, 0.15);
        }
        .view-container {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 10px;
            min-height: 600px;
            position: relative;
            overflow: hidden;
        }
        .view {
            display: none;
            width: 100%;
            height: 650px;
            position: relative;
        }
        .view.active {
            display: block;
        }
        #sunburst-view svg,
        #force-view svg {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* 列表视图 */
        #list-view {
            padding: 10px 20px;
            overflow-y: auto;
            height: 650px;
        }
        #list-view table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        #list-view th {
            text-align: left;
            padding: 10px 8px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            color: #8ab4ff;
            font-weight: 500;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            background: #0b0f1c;
            z-index: 2;
        }
        #list-view td {
            padding: 8px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: #d0dcec;
        }
        #list-view tr:hover td {
            background: rgba(255,255,255,0.04);
        }
        .level-badge-sm {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
        }
        .level-badge-sm.l1 { background: #4caf50; }
        .level-badge-sm.l2 { background: #ffc107; color: #1f2a3a; }
        .level-badge-sm.l3 { background: #ff9800; }
        .level-badge-sm.l4 { background: #e53935; }
        .category-tag {
            background: rgba(255,255,255,0.06);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: #a0b4cc;
        }
        /* tooltip */
        .tooltip {
            position: fixed;
            background: rgba(20, 30, 50, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px 18px;
            color: #f0f4ff;
            font-size: 13px;
            line-height: 1.5;
            max-width: 260px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.6);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 1000;
        }
        .tooltip.visible { opacity: 1; }
        .tooltip strong { display: block; font-size: 15px; margin-bottom: 2px; }
        .tooltip .desc { font-size: 12px; color: #b0c8e0; margin: 4px 0; }
        .tooltip .cat { font-size: 11px; color: #7f8fa3; }
        /* 图例 */
        .legend-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #c8d2e0;
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        @media (max-width: 768px) {
            .container { padding: 16px; }
            .view { height: 500px; }
            #list-view { height: 500px; }
            .stats { gap: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ AI Agent 行为原子 · 多视图演示</h1>
        <div class="sub">三种业界主流可视化方案对比 · 数据相同，视角不同</div>

        <div class="stats" id="stats"></div>

        <div class="tabs">
            <button class="active" data-view="sunburst">🌞 旭日图</button>
            <button data-view="force">🕸️ 力导向图</button>
            <button data-view="list">📋 列表视图</button>
        </div>

        <div class="view-container">
            <div id="sunburst-view" class="view active"></div>
            <div id="force-view" class="view"></div>
            <div id="list-view" class="view"></div>
        </div>

        <div class="legend-bar">
            <div class="legend-item"><span class="legend-dot" style="background:#4caf50;"></span> L1 低风险</div>
            <div class="legend-item"><span class="legend-dot" style="background:#ffc107;"></span> L2 中风险</div>
            <div class="legend-item"><span class="legend-dot" style="background:#ff9800;"></span> L3 高风险</div>
            <div class="legend-item"><span class="legend-dot" style="background:#e53935;"></span> L4 极高风险</div>
        </div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
        // ============================================================
        // 数据准备
        // ============================================================
        const treeData = {
            name: "AI Agent 行为",
            children: [
                {
                    name: "感知与信息获取",
                    children: [
                        { name: "环境感知", permissionLevel: 1, description: "读取屏幕内容、解析输入、接收事件" },
                        { name: "信息检索", permissionLevel: 1, description: "搜索引擎、数据库查询、API调用" },
                        { name: "文件读取", permissionLevel: 2, description: "读取本地文件、遍历目录、读取配置" }
                    ]
                },
                {
                    name: "认知与决策",
                    children: [
                        { name: "规划推理", permissionLevel: 1, description: "任务拆解、制定计划、反思纠正" },
                        { name: "决策行为", permissionLevel: 2, description: "选择行动、请求确认、拒绝、委托" },
                        { name: "记忆操作", permissionLevel: 2, description: "读写短期/长期记忆、检索关联" }
                    ]
                },
                {
                    name: "工具调用",
                    children: [
                        {
                            name: "通用工具",
                            children: [
                                { name: "Function Calling", permissionLevel: 2, description: "调用函数/工具" },
                                { name: "MCP协议", permissionLevel: 2, description: "通过MCP发现和调用工具" }
                            ]
                        },
                        {
                            name: "代码与命令",
                            children: [
                                { name: "执行Shell命令", permissionLevel: 4, description: "执行系统Shell命令" },
                                { name: "运行可执行程序", permissionLevel: 4, description: "运行外部程序" },
                                { name: "执行脚本", permissionLevel: 3, description: "执行Python/Bash脚本" }
                            ]
                        },
                        {
                            name: "文件操作",
                            children: [
                                { name: "创建文件", permissionLevel: 3, description: "新建文件" },
                                { name: "修改文件", permissionLevel: 3, description: "编辑/修改文件内容" },
                                { name: "删除文件", permissionLevel: 3, description: "删除文件或目录" }
                            ]
                        },
                        {
                            name: "网络通信",
                            children: [
                                { name: "HTTP请求", permissionLevel: 2, description: "发起HTTP/HTTPS请求" },
                                { name: "DNS查询", permissionLevel: 2, description: "DNS域名解析" },
                                { name: "发送邮件/消息", permissionLevel: 2, description: "发送邮件、IM消息" }
                            ]
                        },
                        {
                            name: "数据处理",
                            children: [
                                { name: "数据计算", permissionLevel: 1, description: "运算、格式转换" },
                                { name: "生成图表", permissionLevel: 1, description: "生成Excel图表等" }
                            ]
                        },
                        {
                            name: "系统操作",
                            children: [
                                { name: "进程管理", permissionLevel: 4, description: "创建/管理进程" },
                                { name: "系统信息读取", permissionLevel: 2, description: "读取CPU/内存/磁盘等" },
                                { name: "包安装", permissionLevel: 3, description: "pip install等包管理" }
                            ]
                        }
                    ]
                },
                {
                    name: "通信与协作",
                    children: [
                        { name: "Agent间通信", permissionLevel: 2, description: "发送/接收消息" },
                        { name: "任务委派", permissionLevel: 2, description: "委托子任务" },
                        { name: "协作模式", permissionLevel: 1, description: "层级/对等协作" }
                    ]
                },
                {
                    name: "系统级底层",
                    children: [
                        { name: "进程执行", permissionLevel: 4, description: "fork、exec等内核操作" },
                        { name: "文件系统", permissionLevel: 4, description: "权限变更、挂载" },
                        { name: "网络底层", permissionLevel: 4, description: "原始套接字等" },
                        { name: "系统调用", permissionLevel: 4, description: "所有内核级syscall" }
                    ]
                }
            ]
        };

        // 提取所有原子
        function extractAtoms(node, parentPath = []) {
            let atoms = [];
            const currentPath = [...parentPath, node.name];
            if (!node.children) {
                atoms.push({
                    name: node.name,
                    permissionLevel: node.permissionLevel || 1,
                    description: node.description || '',
                    categoryPath: currentPath.slice(0, -1).join(' › ')
                });
            } else {
                for (const child of node.children) {
                    atoms = atoms.concat(extractAtoms(child, currentPath));
                }
            }
            return atoms;
        }
        const allAtoms = extractAtoms(treeData);
        const levelColors = { 1: '#4caf50', 2: '#ffc107', 3: '#ff9800', 4: '#e53935' };

        // 构建旭日图层级：根 -> 等级 -> 类别 -> 原子
        function buildSunburstData(atoms) {
            const root = { name: '行为原子', children: [] };
            const levelMap = {};
            for (let lv = 1; lv <= 4; lv++) {
                levelMap[lv] = { name: 'L' + lv, children: [] };
            }
            atoms.forEach(a => {
                const lv = a.permissionLevel;
                const cat = a.categoryPath || '未分类';
                let catNode = levelMap[lv].children.find(d => d.name === cat);
                if (!catNode) {
                    catNode = { name: cat, children: [] };
                    levelMap[lv].children.push(catNode);
                }
                catNode.children.push({ name: a.name, permissionLevel: a.permissionLevel, description: a.description, categoryPath: a.categoryPath });
            });
            for (let lv = 1; lv <= 4; lv++) {
                if (levelMap[lv].children.length > 0) {
                    root.children.push(levelMap[lv]);
                }
            }
            return root;
        }
        const sunburstRoot = buildSunburstData(allAtoms);

        // 构建力导向图数据：节点 + 边（同类别原子相连）
        function buildForceData(atoms) {
            const nodes = atoms.map((a, i) => ({
                id: i,
                name: a.name,
                level: a.permissionLevel,
                color: levelColors[a.permissionLevel],
                category: a.categoryPath,
                description: a.description
            }));
            const links = [];
            // 按类别分组
            const groups = {};
            nodes.forEach(n => {
                const cat = n.category;
                if (!groups[cat]) groups[cat] = [];
                groups[cat].push(n);
            });
            for (const cat in groups) {
                const group = groups[cat];
                for (let i = 0; i < group.length; i++) {
                    for (let j = i + 1; j < group.length; j++) {
                        links.push({ source: group[i].id, target: group[j].id });
                    }
                }
            }
            return { nodes, links };
        }
        const forceData = buildForceData(allAtoms);

        // ============================================================
        // 统计显示
        // ============================================================
        const statsDiv = document.getElementById('stats');
        const total = allAtoms.length;
        const counts = { 1:0, 2:0, 3:0, 4:0 };
        allAtoms.forEach(a => counts[a.permissionLevel]++);
        statsDiv.innerHTML = `
            <div class="stat-item">🧬 原子总数 <span>${total}</span></div>
            <div class="stat-item">🟢 L1 <span>${counts[1]}</span></div>
            <div class="stat-item">🟡 L2 <span>${counts[2]}</span></div>
            <div class="stat-item">🟠 L3 <span>${counts[3]}</span></div>
            <div class="stat-item">🔴 L4 <span>${counts[4]}</span></div>
        `;

        // ============================================================
        // Tab 切换
        // ============================================================
        const tabs = document.querySelectorAll('.tabs button');
        const views = {
            sunburst: document.getElementById('sunburst-view'),
            force: document.getElementById('force-view'),
            list: document.getElementById('list-view')
        };

        let currentView = 'sunburst';

        function switchView(name) {
            // 隐藏所有view
            Object.values(views).forEach(v => v.classList.remove('active'));
            views[name].classList.add('active');
            // tab样式
            tabs.forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.tabs button[data-view="${name}"]`).classList.add('active');
            currentView = name;
            // 如果切换到力导向图，重新模拟（因为容器尺寸可能变化）
            if (name === 'force') {
                renderForce();
            }
            if (name === 'sunburst') {
                renderSunburst();
            }
            if (name === 'list') {
                renderList();
            }
        }

        tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                const view = btn.dataset.view;
                switchView(view);
            });
        });

        // ============================================================
        // 渲染函数
        // ============================================================
        const tooltip = document.getElementById('tooltip');

        // ---------- 旭日图 ----------
        let sunburstRendered = false;
        function renderSunburst() {
            const container = views.sunburst;
            container.innerHTML = '';
            const width = container.clientWidth || 800;
            const height = container.clientHeight || 600;
            const radius = Math.min(width, height) / 2 * 0.8;

            const svg = d3.select(container)
                .append('svg')
                .attr('viewBox', `0 0 ${width} ${height}`)
                .append('g')
                .attr('transform', `translate(${width/2},${height/2})`);

            const partition = d3.partition()
                .size([2 * Math.PI, radius]);

            const root = d3.hierarchy(sunburstRoot)
                .sum(d => d.children ? 0 : 1)
                .sort((a, b) => b.value - a.value);

            partition(root);

            const arc = d3.arc()
                .startAngle(d => d.x0)
                .endAngle(d => d.x1)
                .innerRadius(d => d.y0)
                .outerRadius(d => d.y1);

            // 颜色按等级
            const color = d3.scaleOrdinal()
                .domain(['L1','L2','L3','L4'])
                .range(['#4caf50','#ffc107','#ff9800','#e53935']);

            const nodes = root.descendants();

            // 绘制弧
            svg.selectAll('path')
                .data(nodes)
                .enter()
                .append('path')
                .attr('d', arc)
                .attr('fill', d => {
                    if (d.depth === 1) return color(d.data.name);
                    if (d.depth === 2) return color(d.parent.data.name);
                    if (d.depth === 3) return color(d.parent.parent.data.name);
                    return '#2a3a5a';
                })
                .attr('stroke', '#0b0f1c')
                .attr('stroke-width', 1.5)
                .attr('opacity', 0.9)
                .style('cursor', 'pointer')
                .on('mouseover', function(event, d) {
                    d3.select(this).attr('opacity', 1).attr('stroke', '#fff').attr('stroke-width', 2);
                    let info = d.data.name;
                    if (d.depth === 3) {
                        const atom = allAtoms.find(a => a.name === d.data.name);
                        if (atom) {
                            tooltip.innerHTML = `<strong>${atom.name}</strong><div class="desc">${atom.description}</div><div class="cat">${atom.categoryPath}</div><span style="display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;background:${levelColors[atom.permissionLevel]};color:#fff;margin-top:4px;">L${atom.permissionLevel}</span>`;
                            tooltip.classList.add('visible');
                            const [mx, my] = d3.pointer(event, document.body);
                            tooltip.style.left = (mx + 16) + 'px';
                            tooltip.style.top = (my - 20) + 'px';
                        }
                    } else {
                        tooltip.innerHTML = `<strong>${d.data.name}</strong><div class="cat">层级 ${d.depth}</div>`;
                        tooltip.classList.add('visible');
                        const [mx, my] = d3.pointer(event, document.body);
                        tooltip.style.left = (mx + 16) + 'px';
                        tooltip.style.top = (my - 20) + 'px';
                    }
                })
                .on('mousemove', function(event) {
                    const [mx, my] = d3.pointer(event, document.body);
                    tooltip.style.left = (mx + 16) + 'px';
                    tooltip.style.top = (my - 20) + 'px';
                })
                .on('mouseout', function() {
                    d3.select(this).attr('opacity', 0.9).attr('stroke', '#0b0f1c').attr('stroke-width', 1.5);
                    tooltip.classList.remove('visible');
                });

            // 添加文本标签（只对第三层原子）
            svg.selectAll('text')
                .data(nodes.filter(d => d.depth === 3))
                .enter()
                .append('text')
                .attr('transform', d => {
                    const angle = (d.x0 + d.x1) / 2;
                    const radius = (d.y0 + d.y1) / 2;
                    const x = radius * Math.sin(angle);
                    const y = -radius * Math.cos(angle);
                    return `translate(${x},${y}) rotate(${angle * 180 / Math.PI - 90})`;
                })
                .attr('text-anchor', 'middle')
                .attr('dominant-baseline', 'central')
                .style('font-size', '9px')
                .style('fill', '#fff')
                .style('font-weight', '500')
                .style('text-shadow', '0 0 4px rgba(0,0,0,0.8)')
                .style('pointer-events', 'none')
                .text(d => d.data.name.length > 6 ? d.data.name.slice(0,5)+'…' : d.data.name);

            sunburstRendered = true;
        }

        // ---------- 力导向图 ----------
        let forceRendered = false;
        function renderForce() {
            const container = views.force;
            container.innerHTML = '';
            const width = container.clientWidth || 800;
            const height = container.clientHeight || 600;

            const svg = d3.select(container)
                .append('svg')
                .attr('viewBox', `0 0 ${width} ${height}`);

            const g = svg.append('g');

            const simulation = d3.forceSimulation(forceData.nodes)
                .force('link', d3.forceLink(forceData.links).id(d => d.id).distance(80))
                .force('charge', d3.forceManyBody().strength(-300))
                .force('center', d3.forceCenter(width/2, height/2))
                .force('collision', d3.forceCollide().radius(30));

            const link = g.append('g')
                .selectAll('line')
                .data(forceData.links)
                .enter()
                .append('line')
                .attr('stroke', 'rgba(255,255,255,0.2)')
                .attr('stroke-width', 1.5);

            const node = g.append('g')
                .selectAll('g')
                .data(forceData.nodes)
                .enter()
                .append('g')
                .call(d3.drag()
                    .on('start', dragstarted)
                    .on('drag', dragged)
                    .on('end', dragended)
                );

            node.append('circle')
                .attr('r', 18)
                .attr('fill', d => d.color)
                .attr('fill-opacity', 0.85)
                .attr('stroke', '#fff')
                .attr('stroke-width', 1.5)
                .style('filter', 'drop-shadow(0 0 8px rgba(0,0,0,0.5))')
                .on('mouseover', function(event, d) {
                    d3.select(this).attr('r', 22).attr('fill-opacity', 1);
                    tooltip.innerHTML = `<strong>${d.name}</strong><div class="desc">${d.description}</div><div class="cat">${d.category}</div><span style="display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;background:${levelColors[d.level]};color:#fff;margin-top:4px;">L${d.level}</span>`;
                    tooltip.classList.add('visible');
                    const [mx, my] = d3.pointer(event, document.body);
                    tooltip.style.left = (mx + 16) + 'px';
                    tooltip.style.top = (my - 20) + 'px';
                })
                .on('mousemove', function(event) {
                    const [mx, my] = d3.pointer(event, document.body);
                    tooltip.style.left = (mx + 16) + 'px';
                    tooltip.style.top = (my - 20) + 'px';
                })
                .on('mouseout', function() {
                    d3.select(this).attr('r', 18).attr('fill-opacity', 0.85);
                    tooltip.classList.remove('visible');
                });

            node.append('text')
                .attr('text-anchor', 'middle')
                .attr('dominant-baseline', 'central')
                .style('fill', '#fff')
                .style('font-size', '8px')
                .style('font-weight', '600')
                .style('pointer-events', 'none')
                .text(d => d.name.length > 5 ? d.name.slice(0,4)+'…' : d.name);

            simulation.on('tick', () => {
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);
                node
                    .attr('transform', d => `translate(${d.x},${d.y})`);
            });

            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }
            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }
            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }

            forceRendered = true;
        }

        // ---------- 列表视图 ----------
        function renderList() {
            const container = views.list;
            container.innerHTML = '';
            const table = document.createElement('table');
            table.innerHTML = `
                <thead><tr>
                    <th>行为原子</th>
                    <th>权限等级</th>
                    <th>所属类别</th>
                </tr></thead>
                <tbody></tbody>
            `;
            const tbody = table.querySelector('tbody');
            allAtoms.sort((a,b) => a.permissionLevel - b.permissionLevel || a.name.localeCompare(b.name));
            allAtoms.forEach(a => {
                const tr = document.createElement('tr');
                const lvClass = 'l' + a.permissionLevel;
                tr.innerHTML = `
                    <td><strong>${a.name}</strong></td>
                    <td><span class="level-badge-sm ${lvClass}">L${a.permissionLevel}</span></td>
                    <td><span class="category-tag">${a.categoryPath || '未分类'}</span></td>
                `;
                tbody.appendChild(tr);
            });
            container.appendChild(table);
        }

        // ============================================================
        // 初始化：默认显示旭日图
        // ============================================================
        // 需要等待DOM渲染完成
        setTimeout(() => {
            renderSunburst();
            renderForce();
            renderList();
            // 默认显示旭日图
            switchView('sunburst');
        }, 100);

        // 窗口大小变化时重新渲染
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (currentView === 'sunburst') renderSunburst();
                if (currentView === 'force') renderForce();
            }, 300);
        });
    </script>
</body>
</html>
